name: Automerge Dependabot Prs

on:
  push:
    paths:
      - '.github/workflows/create-labels.yaml'
jobs:
  create-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 'Label Creator'
        uses: cssnr/label-creator-action@v1
        with:
          data: |
            github-actions:
              color: 2d2d2d
              description: Github actions update
            gradle-dependency:
              color: 4dc9c0
              description: Dependency update
            tms-backend:
              color: 003153
              description: Navikt min side backend
